<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lernplattform</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="stylesheet" href="/style.css">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch {}</script>
</head>
<body>
  <aside id="sidebar">
    <div class="side-head">
      <button class="brand" id="homeBtn" title="Ordner wechseln">
        <span class="brand-logo">📚</span>
        <span class="brand-text"><strong>Lernplattform <span class="chev">▾</span></strong><small id="rootName">Schule</small></span>
      </button>
      <button class="icon-btn" id="collapseBtn" title="Seitenleiste ausblenden">«</button>
    </div>

    <label class="search">
      <svg viewBox="0 0 20 20" width="15" height="15"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13 13l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="searchInput" type="search" placeholder="Suchen…  (Strg+K)" autocomplete="off">
    </label>

    <nav class="side-nav">
      <button class="nav-item" data-go="home"><span>🏠</span> Startseite</button>
    </nav>

    <div class="side-section">
      <span>Ordner</span>
      <button class="icon-btn small" id="newRootPage" title="Neue Seite im Hauptordner">+</button>
    </div>
    <div id="tree" class="tree"></div>
    <div id="searchResults" class="tree" hidden></div>

    <div class="side-foot">
      <span class="sync" id="syncState" title="Live-Verbindung zum Ordner"><i></i><em>Verbinde…</em></span>
      <button class="icon-btn" id="themeBtn" title="Hell/Dunkel">◐</button>
    </div>
  </aside>

  <main id="main">
    <header class="topbar">
      <button class="icon-btn" id="expandBtn" title="Seitenleiste einblenden" hidden>»</button>
      <div id="crumbs" class="crumbs"></div>
      <div class="top-actions">
        <span id="saveState" class="save-state"></span>
        <div id="topButtons"></div>
      </div>
    </header>
    <div id="banner" class="banner" hidden></div>
    <section id="view" class="view"></section>
  </main>

  <div id="menu" class="menu" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <input type="file" id="filePicker" hidden multiple>

  <script src="/markdown.js"></script>
  <script src="/editor.js"></script>
  <script src="/docedit.js"></script>
  <script src="/imageedit.js"></script>
  <script src="/textedit.js"></script>
  <script src="/app.js"></script>
</body>
</html>
